<!DOCTYPE html>
<html>
<head>
    <title>Nested Boxes</title>

    <style>
        .box1 {
            background-color: blue;
            padding: 40px;
            width: 500px;
            height: 400px;
        }

        .box2 {
            background-color: green;
            padding: 40px;
            height: 300px;
        }

        .box3 {
            background-color: pink;
            padding: 40px;
            height: 200px;
        }

        .box4 {
            background-color: orange;
            height: 120px;
        }
    </style>
</head>

<body>

    <div class="box1">
        <div class="box2">
            <div class="box3">
                <div class="box4">
                </div>
            </div>
        </div>
    </div>

</body>
</html>
