<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="bento.css">
</head>

<body>

    <div class="container">

        <!-- Top box -->
        <div class="top box"></div>

        <!-- Bottom section -->
        <div class="bottom">

            <!-- Left side -->
            <div class="left">

                <div class="middle box"></div>

                <div class="small-boxes">
                    <div class="small box"></div>
                    <div class="small box"></div>
                </div>

            </div>

            <!-- Right tall box -->
            <div class="side box"></div>

        </div>

    </div>

</body>
</html>
